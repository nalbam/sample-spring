<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css"
    integrity="sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/main.css">
  <title>Hello, world!</title>
</head>

<body>

  <main role="main">
    <section class="hero text-center bg-body-tertiary">
      <div class="container">
        <h1><img class="img-fluid" src="https://nalbam.com/static/logo/spring-boot.png" alt="Spring Boot"></h1>
        <h3 class="hello-title text-break" th:text="${host}"></h3>
        <p th:text="${date}"></p>
        <p th:text="${cluster}"></p>
        <p th:text="${profile}"></p>
        <p th:text="${message}"></p>
        <p th:text="${version}"></p>
        <div class="d-flex justify-content-center gap-2">
          <button type="button" class="btn btn-primary btn-thumbs-up">
            <i class="fa-regular fa-thumbs-up" aria-hidden="true"></i>
            <span class="visually-hidden">Thumbs up</span> <span id="thumbs-up-count">0</span>
          </button>
          <button type="button" class="btn btn-danger btn-thumbs-down">
            <i class="fa-regular fa-thumbs-down" aria-hidden="true"></i>
            <span class="visually-hidden">Thumbs down</span> <span id="thumbs-down-count">0</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
  <script src="/static/js/counter.js"></script>
</body>

</html>

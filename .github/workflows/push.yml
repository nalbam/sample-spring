name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '27'
          cache: maven

      # build.sh runs ./mvnw, which uses the Maven version pinned in .mvn/wrapper.
      - name: Run Build
        run: |
          ./build.sh

      - name: Check jar responds
        run: |
          java -jar target/*.jar --spring.profiles.active=default > "${RUNNER_TEMP}/jar.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:8080/health; then
              break
            fi
            sleep 1
          done
          status=0
          for path in / /health /live /actuator/health /actuator/prometheus; do
            curl -fsS -o /dev/null "http://localhost:8080${path}" || { echo "::error::GET ${path} failed"; status=1; }
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" || true
          if [ "$status" -ne 0 ]; then
            cat "${RUNNER_TEMP}/jar.log"
          fi
          exit "$status"

      # Tag runs (release.yml) hand the tested jar to the image job of the same run.
      - name: Upload jar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Build image
        run: docker build -t sample-spring:ci .

      - name: Check container responds on /health
        run: |
          docker run -d --name sample-spring-ci -e SPRING_PROFILES_ACTIVE=default -p 8080:8080 sample-spring:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs sample-spring-ci
          exit 1

      - name: Check Java agents
        run: |
          docker rm -f sample-spring-ci
          ./scripts/smoke-agents.sh sample-spring:ci

# The same file is used in every sample-* repository.
# tag -> ci -> package (GHCR image) -> release (GitHub Release) -> deploy
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Releases share the latest image tag and the deploy targets, so they run one at
# a time. queue: max keeps up to 100 waiting runs instead of only the newest one.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      # All tags, so the tag check can tell whether this is the highest stable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag
        id: tag
        run: scripts/release.sh tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  package:
    needs: [tag, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The raw tag keeps the "v" prefix. Only the highest stable tag moves latest,
      # so re-running an older release does not move latest back.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable=${{ needs.tag.outputs.latest }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context and build arguments as the ci job, so the layers come from
      # the cache that the tested build wrote.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    needs: [tag, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The artifact that the ci job built and smoke-tested for this tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact
          path: dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.package.outputs.image }}
          DIGEST: ${{ needs.package.outputs.digest }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/notes.md"
          {
            printf 'Image: `%s:%s`\n\nDigest: `%s`\n\n' "$IMAGE" "$tag" "$DIGEST"
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$tag" --jq .body
          } > "$notes"
          # A re-run updates the notes and assets of the existing release.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file "$notes" --prerelease="$PRERELEASE"
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" \
              --notes-file "$notes" --prerelease="$PRERELEASE"
          fi
          gh release view "$tag" --json url,assets --jq '.url, .assets[].name'

  # Deploys only when the repository variable GITOPS_REPO is set.
  alpha:
    needs: release
    if: vars.GITOPS_REPO != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: alpha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy ${{ github.ref_name }} to alpha
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ github.ref_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: scripts/release.sh deploy alpha

  # Stable tags only. Protect the "prod" environment to require an approval.
  prod:
    needs: [tag, alpha]
    if: needs.tag.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy ${{ github.ref_name }} to prod
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ github.ref_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          AUTO_MERGE: "true"
        run: scripts/release.sh deploy prod

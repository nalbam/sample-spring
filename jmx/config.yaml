# JMX Exporter 1.7.0 Java agent configuration.
# entrypoint.sh starts the agent as -javaagent:jmx_javaagent.jar=8081:config.yaml,
# which serves http://<host>:8081/metrics.
# https://github.com/prometheus/jmx_exporter/blob/1.7.0/website/docs/reference/configuration.md
---
lowercaseOutputName: true
lowercaseOutputLabelNames: true
# includeObjectNames: ["java.lang:*"]
# excludeObjectNames: ["java.lang:type=MemoryPool,*"]
rules:
  - pattern: ".*"
